<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" role="img" aria-label="Ahmeduddin Mohammed, ML and AI Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.55" stop-color="#0a1525"/>
      <stop offset="1" stop-color="#0d1c30"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#00d4ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .dot { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.8; } }
    </style>
  </defs>
  <rect width="1200" height="240" fill="url(#bg)"/>

  <!-- network nodes -->
  <g fill="#00d4ff">
    <circle class="dot" cx="90" cy="50" r="2.5"/>
    <circle class="dot" cx="180" cy="95" r="2" style="animation-delay:.6s"/>
    <circle class="dot" cx="1040" cy="45" r="2.5" style="animation-delay:1.2s"/>
    <circle class="dot" cx="1120" cy="110" r="2" style="animation-delay:1.8s"/>
    <circle class="dot" cx="980" cy="120" r="1.8" style="animation-delay:2.4s"/>
  </g>
  <g stroke="#8b5cf6" stroke-opacity="0.18" stroke-width="1">
    <line x1="90" y1="50" x2="180" y2="95"/>
    <line x1="1040" y1="45" x2="1120" y2="110"/>
    <line x1="1040" y1="45" x2="980" y2="120"/>
  </g>

  <text x="600" y="100" text-anchor="middle" fill="url(#title)"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="50" font-weight="800">Ahmeduddin Mohammed<animate attributeName="opacity" values="0;1" dur="1.4s" begin="0s" fill="freeze"/></text>
  <text x="600" y="142" text-anchor="middle" fill="#c4b5fd"
        font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" letter-spacing="1.5">ML &amp; AI ENGINEER  ·  PRODUCTION ML  ·  GENAI SYSTEMS<animate attributeName="opacity" values="0;0;1" keyTimes="0;0.4;1" dur="2s" begin="0s" fill="freeze"/></text>

  <!-- moving waves -->
  <g>
    <path d="M0 190 C 150 165 300 215 450 190 S 750 165 900 190 S 1200 215 1350 190 S 1650 165 1800 190 S 2100 215 2250 190 L2400 190 L2400 240 L0 240 Z" fill="#0d1117" opacity="0.65">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="14s" repeatCount="indefinite"/>
    </path>
    <path d="M0 205 C 200 185 400 225 600 205 S 1000 185 1200 205 S 1600 225 1800 205 S 2200 185 2400 205 L2400 240 L0 240 Z" fill="#0d1117">
      <animateTransform attributeName="transform" type="translate" from="-1200 0" to="0 0" dur="18s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
